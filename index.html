<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簿記1級 復習スケジューラー</title>
<style>
  :root {
    --ink: #1c2129;
    --ink-soft: #5b6472;
    --ink-faint: #9aa2ad;
    --paper: #f6f4ef;
    --card: #ffffff;
    --line: #e2ded3;
    --accent: #2f5d50;
    --accent-soft: #e4ede9;
    --warn: #a1462f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 28px; }
  h2 { font-size: 15px; font-weight: 700; margin: 36px 0 12px; color: var(--ink); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat .num { font-size: 26px; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .badge { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; padding-top: 2px; }
  .eval-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .eval-grid button { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .eval-grid button:active { background: var(--accent-soft); }
  .empty { font-size: 13.5px; color: var(--ink-faint); margin: 4px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
  .chip.new { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
  .plan-day { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; background: var(--card); }
  .plan-day .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .plan-day .head .date { font-weight: 600; }
  .plan-day .head .cap { color: var(--ink-faint); font-size: 12px; }
  .warn { color: var(--warn); font-size: 12.5px; margin-top: 6px; }
  .field-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  input, select { font-family: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  input[type="text"] { flex: 1; min-width: 140px; }
  button.primary { font-family: inherit; font-size: 14px; padding: 9px 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .list-line { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 8px; }
  .list-line:last-child { border-bottom: none; }
  .list-line .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .del-btn, .edit-btn { background: none; border: none; color: var(--ink-faint); font-size: 12.5px; cursor: pointer; text-decoration: underline; padding: 4px; }
  .del-btn { color: var(--warn); }
  .hint { font-size: 12px; color: var(--ink-faint); margin: -4px 0 12px; }
  .chapter-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .chapter-row:last-child { border-bottom: none; }
  .chapter-row .info b { color: var(--accent); font-weight: 600; }
  .unlearned-btn { background: var(--accent-soft); color: var(--accent); border: none; border-radius: 7px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>簿記1級 復習スケジューラー</h1>
  <p class="sub">忘却曲線に基づいて復習日を自動で組み立てます</p>
  <div id="app"></div>
</div>

<script>
const STORAGE_KEY = 'boki-data';

function pad2(n) { return String(n).padStart(2, '0'); }
function localDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function todayStr() { return localDateStr(new Date()); }
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return localDateStr(dt);
}
function fmtDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const w = ['日','月','火','水','木','金','土'][dt.getDay()];
  return `${m}/${d}(${w})`;
}
function fmtHours(min) { return (Math.round((min / 60) * 10) / 10) + '時間'; }

let data = { chapters: [], topics: [], settings: { defaultCapacityMin: 120, reviewMin: 60, newMin: 105 }, dateOverrides: {} };

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  data.topics = data.topics || [];
  data.chapters = data.chapters || [];
  data.topics.forEach(t => { if (!t.status) t.status = 'learned'; });
  if (!data.settings) data.settings = {};
  if (data.settings.defaultCapacityMin === undefined) data.settings.defaultCapacityMin = 120;
  if (data.settings.reviewMin === undefined) data.settings.reviewMin = 60;
  if (data.settings.newMin === undefined) data.settings.newMin = 105;
  if (!data.dateOverrides) data.dateOverrides = {};
  render();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function addChapter(name) {
  if (!name || !name.trim()) return;
  data.chapters.push({ id: uid(), name: name.trim() });
  save(); render();
}

function editChapter(id) {
  const c = data.chapters.find(x => x.id === id);
  if (!c) return;
  const name = prompt('大分野名を編集', c.name);
  if (name === null || !name.trim()) return;
  c.name = name.trim();
  save(); render();
}

function deleteChapter(id) {
  const c = data.chapters.find(x => x.id === id);
  if (!c) return;
  const count = data.topics.filter(t => t.chapterId === id).length;
  const msg = count > 0
    ? `「${c.name}」には${count}件の論点があります。大分野と論点をすべて削除しますか？`
    : `「${c.name}」を削除しますか？`;
  if (!confirm(msg)) return;
  data.topics = data.topics.filter(t => t.chapterId !== id);
  data.chapters = data.chapters.filter(x => x.id !== id);
  save(); render();
}

function addTopic(chapterId, name) {
  if (!name || !name.trim() || !chapterId) return;
  data.topics.push({ id: uid(), chapterId, name: name.trim(), status: 'unlearned', interval: 0, nextReview: null, lastResult: null });
  save(); render();
}

function editTopic(id) {
  const t = data.topics.find(x => x.id === id);
  if (!t) return;
  const name = prompt('論点名を編集', t.name);
  if (name === null || !name.trim()) return;
  t.name = name.trim();
  save(); render();
}

function deleteTopic(id) {
  const t = data.topics.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`「${t.name}」を削除しますか？`)) return;
  data.topics = data.topics.filter(x => x.id !== id);
  save(); render();
}

function markLearned(topicId) {
  const t = data.topics.find(x => x.id === topicId);
  if (!t) return;
  const today = todayStr();
  t.status = 'learned'; t.interval = 1; t.nextReview = addDays(today, 1); t.lastResult = 'new';
  save(); render();
}

function evaluate(topicId, result) {
  const t = data.topics.find(x => x.id === topicId);
  if (!t) return;
  const today = todayStr();
  if (result === 'bad') t.interval = 1;
  else if (result === 'ok') t.interval = Math.max(1, Math.round(t.interval * 1.7));
  else t.interval = Math.max(1, Math.round(t.interval * 2.5));
  t.nextReview = addDays(today, t.interval);
  t.lastResult = result;
  save(); render();
}

function chapterName(id) {
  const c = data.chapters.find(c => c.id === id);
  return c ? c.name : '(不明な分野)';
}

function capacityForDate(date) {
  if (data.dateOverrides[date] !== undefined) return data.dateOverrides[date];
  return data.settings.defaultCapacityMin;
}

function setDefaultCapacity(hours) {
  const v = parseFloat(hours);
  if (isNaN(v) || v < 0) return;
  data.settings.defaultCapacityMin = Math.round(v * 60);
  save(); render();
}

function setTaskMinutes(reviewHours, newHours) {
  const rv = parseFloat(reviewHours), nv = parseFloat(newHours);
  if (!isNaN(rv) && rv > 0) data.settings.reviewMin = Math.round(rv * 60);
  if (!isNaN(nv) && nv > 0) data.settings.newMin = Math.round(nv * 60);
  save(); render();
}

function addOverride(date, hours) {
  if (!date) return;
  const v = parseFloat(hours);
  if (isNaN(v) || v < 0) return;
  data.dateOverrides[date] = Math.round(v * 60);
  save(); render();
}

function removeOverride(date) {
  delete data.dateOverrides[date];
  save(); render();
}

function buildPlan(horizonDays) {
  const today = todayStr();
  const REVIEW_MIN = data.settings.reviewMin, NEW_MIN = data.settings.newMin;
  const learned = data.topics.filter(t => t.status === 'learned').slice().sort((a, b) => a.nextReview.localeCompare(b.nextReview));
  const unlearned = data.topics.filter(t => t.status === 'unlearned');
  let ri = 0, ni = 0;
  const plan = [];
  for (let d = 0; d < horizonDays; d++) {
    const date = addDays(today, d);
    let cap = capacityForDate(date);
    const capTotal = cap;
    const items = [];
    while (ri < learned.length && learned[ri].nextReview <= date && cap >= REVIEW_MIN) {
      items.push({ type: 'review', name: learned[ri].name });
      cap -= REVIEW_MIN; ri++;
    }
    while (ni < unlearned.length && cap >= NEW_MIN) {
      items.push({ type: 'new', name: unlearned[ni].name });
      cap -= NEW_MIN; ni++;
    }
    plan.push({ date, items, usedMin: capTotal - cap, capMin: capTotal });
  }
  const pendingReviews = learned.length - ri;
  return { plan, pendingReviews };
}

function render() {
  const today = todayStr();
  const learned = data.topics.filter(t => t.status === 'learned');
  const unlearned = data.topics.filter(t => t.status === 'unlearned');
  const due = learned.filter(t => t.nextReview <= today).sort((a, b) => a.nextReview.localeCompare(b.nextReview));

  const chapterOptions = data.chapters.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

  const chapterRows = data.chapters.map(c => {
    const total = data.topics.filter(t => t.chapterId === c.id).length;
    const done = data.topics.filter(t => t.chapterId === c.id && t.status === 'learned').length;
    return `
      <div class="chapter-row">
        <span class="info">${c.name} <b>${done}/${total}</b></span>
        <span class="btns">
          <button class="edit-btn" data-action="editChapter" data-id="${c.id}">編集</button>
          <button class="del-btn" data-action="deleteChapter" data-id="${c.id}">削除</button>
        </span>
      </div>`;
  }).join('');

  const dueHtml = due.length === 0
    ? `<p class="empty">今日の復習はありません。</p>`
    : due.map(t => `
      <div class="card">
        <div class="row-top">
          <div>
            <div class="name">${t.name}</div>
            <div class="meta">${chapterName(t.chapterId)}</div>
          </div>
          <span class="badge">間隔 ${t.interval}日</span>
        </div>
        <div class="eval-grid">
          <button data-action="evaluate" data-id="${t.id}" data-result="bad">😖 忘れてた</button>
          <button data-action="evaluate" data-id="${t.id}" data-result="ok">🙂 まあまあ</button>
          <button data-action="evaluate" data-id="${t.id}" data-result="good">😄 バッチリ</button>
        </div>
      </div>
    `).join('');

  const { plan, pendingReviews } = buildPlan(7);
  const planHtml = plan.map(p => {
    const reviewItems = p.items.filter(i => i.type === 'review');
    const newItems = p.items.filter(i => i.type === 'new');
    return `
      <div class="plan-day">
        <div class="head">
          <span class="date">${fmtDate(p.date)}</span>
          <span class="cap">${p.capMin === 0 ? '予定なし' : fmtHours(p.usedMin) + ' / ' + fmtHours(p.capMin)}</span>
        </div>
        ${p.items.length === 0 ? `<p class="empty">割り当てなし</p>` : `
        <div class="chips">
          ${reviewItems.map(i => `<span class="chip">復習: ${i.name}</span>`).join('')}
          ${newItems.map(i => `<span class="chip new">新規: ${i.name}</span>`).join('')}
        </div>
        `}
      </div>
    `;
  }).join('') + (pendingReviews > 0 ? `<p class="warn">キャパシティが足りず、${pendingReviews}件の復習が7日以降に持ち越されています。</p>` : '');

  const overrideList = Object.keys(data.dateOverrides).sort().map(date => `
    <div class="list-line">
      <span>${fmtDate(date)}: ${data.dateOverrides[date] === 0 ? '予定不可' : fmtHours(data.dateOverrides[date])}</span>
      <button class="del-btn" data-action="removeOverride" data-date="${date}">削除</button>
    </div>
  `).join('');

  const unlearnedHtml = unlearned.length === 0
    ? `<p class="empty">未学習の論点はありません。</p>`
    : unlearned.map(t => `
      <div class="list-line">
        <div>
          <div class="name">${t.name}</div>
          <div class="meta">${chapterName(t.chapterId)}</div>
        </div>
        <span class="btns">
          <button class="unlearned-btn" data-action="markLearned" data-id="${t.id}">今日やった</button>
          <button class="edit-btn" data-action="editTopic" data-id="${t.id}">編集</button>
          <button class="del-btn" data-action="deleteTopic" data-id="${t.id}">削除</button>
        </span>
      </div>
    `).join('');

  const learnedHtml = learned.length === 0
    ? `<p class="empty">学習済みの論点はまだありません。</p>`
    : learned.slice().sort((a, b) => a.nextReview.localeCompare(b.nextReview)).map(t => `
      <div class="list-line">
        <div>
          <div class="name">${t.name}</div>
          <div class="meta">${chapterName(t.chapterId)} ・ 次回復習: ${fmtDate(t.nextReview)}</div>
        </div>
        <span class="btns">
          <button class="edit-btn" data-action="editTopic" data-id="${t.id}">編集</button>
          <button class="del-btn" data-action="deleteTopic" data-id="${t.id}">削除</button>
        </span>
      </div>
    `).join('');

  document.getElementById('app').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="num">${due.length}</div><div class="label">今日の復習</div></div>
      <div class="stat"><div class="num">${unlearned.length}</div><div class="label">未学習</div></div>
    </div>

    <h2>今日の復習</h2>
    ${dueHtml}

    <h2>実行プラン(今後7日・キャパシティ考慮)</h2>
    ${planHtml}

    <h2>学習キャパシティ設定</h2>
    <p class="hint">通常1日にかけられる時間</p>
    <div class="field-row">
      <input id="defaultCap" type="number" min="0" step="0.5" value="${data.settings.defaultCapacityMin / 60}" style="width:80px;" />
      <span class="hint" style="margin:0;">時間/日</span>
      <button class="primary" data-action="setDefaultCapacity">更新</button>
    </div>

    <p class="hint">1件あたりの目安時間</p>
    <div class="field-row">
      <label style="font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;">復習<input id="reviewHours" type="number" min="0.25" step="0.25" value="${data.settings.reviewMin / 60}" style="width:60px;" />時間</label>
      <label style="font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;">新規<input id="newHours" type="number" min="0.25" step="0.25" value="${data.settings.newMin / 60}" style="width:60px;" />時間</label>
      <button class="primary" data-action="setTaskMinutes">更新</button>
    </div>

    <p class="hint">特定の日を変更(予定がある日など。0時間で不可扱い)</p>
    <div>${overrideList || '<p class="empty">個別設定なし</p>'}</div>
    <div class="field-row">
      <input id="overrideDate" type="date" style="flex:1;" />
      <input id="overrideHours" type="number" min="0" step="0.5" placeholder="時間" style="width:70px;" />
      <button class="primary" data-action="addOverride">設定</button>
    </div>

    <h2>未学習の論点</h2>
    ${unlearnedHtml}

    <h2>論点を登録</h2>
    ${data.chapters.length === 0 ? `<p class="empty">先に下の「大分野」を登録してください。</p>` : `
    <div class="field-row">
      <select id="topicChapter">${chapterOptions}</select>
    </div>
    <div class="field-row">
      <input id="topicName" type="text" placeholder="例: 収益認識の5ステップモデル" />
      <button class="primary" data-action="addTopic">登録(未学習)</button>
    </div>
    `}

    <h2>学習済みの論点(編集・削除)</h2>
    ${learnedHtml}

    <h2>大分野の管理</h2>
    ${chapterRows || '<p class="empty">まだ大分野がありません。</p>'}
    <div class="field-row" style="margin-top:10px;">
      <input id="chapterName" type="text" placeholder="例: 商業簿記・収益認識" />
      <button class="primary" data-action="addChapter">追加</button>
    </div>
  `;
}

document.getElementById('app').addEventListener('click', function (e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  try {
    if (action === 'evaluate') evaluate(id, btn.dataset.result);
    else if (action === 'markLearned') markLearned(id);
    else if (action === 'editTopic') editTopic(id);
    else if (action === 'deleteTopic') deleteTopic(id);
    else if (action === 'editChapter') editChapter(id);
    else if (action === 'deleteChapter') deleteChapter(id);
    else if (action === 'removeOverride') removeOverride(btn.dataset.date);
    else if (action === 'addChapter') {
      const el = document.getElementById('chapterName');
      addChapter(el.value); el.value = '';
    } else if (action === 'addTopic') {
      const chEl = document.getElementById('topicChapter');
      const nameEl = document.getElementById('topicName');
      addTopic(chEl.value, nameEl.value); nameEl.value = '';
    } else if (action === 'setDefaultCapacity') {
      setDefaultCapacity(document.getElementById('defaultCap').value);
    } else if (action === 'setTaskMinutes') {
      setTaskMinutes(document.getElementById('reviewHours').value, document.getElementById('newHours').value);
    } else if (action === 'addOverride') {
      addOverride(document.getElementById('overrideDate').value, document.getElementById('overrideHours').value);
    }
  } catch (err) {
    alert('エラーが発生しました: ' + (err && err.message ? err.message : err));
  }
});

load();
</script>
</body>
</html>
